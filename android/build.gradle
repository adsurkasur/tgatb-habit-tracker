// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Use an AGP version that pairs with Gradle 8.13
        classpath 'com.android.tools.build:gradle:9.1.0'
    classpath 'com.google.gms:google-services:4.4.3'
    }
}

apply from: "variables.gradle"

// Repositories are centrally managed in settings.gradle (PREFER_SETTINGS mode)

// ponytail: capacitor-save-as hardcodes compileSdk 35, but capacitor-android 8 requires 36.
// Drop this once the plugin reads rootProject.ext.compileSdkVersion.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library')) {
            project.android.compileSdk = rootProject.ext.compileSdkVersion
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
